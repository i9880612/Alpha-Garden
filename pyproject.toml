[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-garden"
version = "0.1.0"
description = "Alpha formula research system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alpha-garden = "alpha_garden.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
