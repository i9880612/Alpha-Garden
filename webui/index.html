<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before the first paint, including while modules load.
      try {
        document.documentElement.classList.toggle("dark", localStorage.getItem("alphagarden-console-theme") !== "light");
      } catch { /* Storage can be unavailable; keep the default dark theme. */ }
    </script>
    <style>
      html { background: #f5f5f5; color-scheme: light; }
      html.dark { background: #0a0a0a; color-scheme: dark; }
      body { margin: 0; }
    </style>
    <link rel="stylesheet" href="/src/styles/loading.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alpha Garden — 自动化公式研究控制台" />
    <title>Alpha Garden</title>
  </head>
  <body>
    <div id="root">
      <div class="ag-loading ag-loading--fullscreen" role="status" aria-label="Loading">
        <img class="ag-loading-logo" src="/src/assets/logo/logo-full.svg" alt="Alpha Garden" width="220" height="64" />
        <span class="ag-loading-track" aria-hidden="true"></span>
        <span class="ag-loading-label">Loading</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
